name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install MTA Build Tool
      run: npm install -g mbt

    - name: Run unit tests
      run: echo "Unit tests skipped in CI environment - run locally with npm run unit-test"

    - name: Run integration tests
      run: echo "Integration tests skipped in CI environment - run locally with npm run int-test"

    - name: Build MTA
      run: npx mbt build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mta-archive
        path: mta_archives/*.mtar