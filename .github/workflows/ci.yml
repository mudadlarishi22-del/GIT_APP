name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: |
        npm install -g puppeteer
        npx puppeteer browsers install chrome
        npx fiori run --config ./ui5-mock.yaml --port 8080 &
        sleep 10
        node -e "
        const puppeteer = require('puppeteer');
        (async () => {
          const browser = await puppeteer.launch({ headless: true });
          const page = await browser.newPage();
          await page.goto('http://localhost:8080/test/unit/unitTests.qunit.html');
          await page.waitForSelector('.qunit-testresult', { timeout: 30000 });
          const result = await page.evaluate(() => {
            const passed = document.querySelector('.qunit-testresult .passed');
            const failed = document.querySelector('.qunit-testresult .failed');
            return { passed: passed ? parseInt(passed.textContent) : 0, failed: failed ? parseInt(failed.textContent) : 0 };
          });
          await browser.close();
          if (result.failed > 0) {
            console.error(\`Unit tests failed: \${result.failed} failed, \${result.passed} passed\`);
            process.exit(1);
          } else {
            console.log(\`Unit tests passed: \${result.passed} passed\`);
          }
        })();
        "
        pkill -f fiori
      env:
        CI: true

    - name: Run integration tests
      run: |
        npx fiori run --config ./ui5-mock.yaml --port 8080 &
        sleep 10
        node -e "
        const puppeteer = require('puppeteer');
        (async () => {
          const browser = await puppeteer.launch({ headless: true });
          const page = await browser.newPage();
          await page.goto('http://localhost:8080/test/integration/opaTests.qunit.html');
          await page.waitForSelector('.qunit-testresult', { timeout: 60000 });
          const result = await page.evaluate(() => {
            const passed = document.querySelector('.qunit-testresult .passed');
            const failed = document.querySelector('.qunit-testresult .failed');
            return { passed: passed ? parseInt(passed.textContent) : 0, failed: failed ? parseInt(failed.textContent) : 0 };
          });
          await browser.close();
          if (result.failed > 0) {
            console.error(\`Integration tests failed: \${result.failed} failed, \${result.passed} passed\`);
            process.exit(1);
          } else {
            console.log(\`Integration tests passed: \${result.passed} passed\`);
          }
        })();
        "
        pkill -f fiori
      env:
        CI: true

    - name: Build MTA
      run: npm run build:mta

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mta-archive
        path: mta_archives/*.mtar